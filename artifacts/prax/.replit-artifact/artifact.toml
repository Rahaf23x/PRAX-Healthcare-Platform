kind = "web"
previewPath = "/"
title = "PRAX Healthcare Platform"
description = "A bilingual Arabic and English healthcare coordination platform for clinicians, paramedics, and hospital teams. Provides patient identification, medical history, vital signs, AI clinical support, physician consultation, hospital readiness, alerts, and persistent RTL/LTR language switching."
version = "1.0.0"
id = "artifacts/prax"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19000

[services.development]
run = "pnpm --filter @workspace/prax run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/prax", "run", "build" ]
serve = "static"
publicDir = "artifacts/prax/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19000"
BASE_PATH = "/"
